services:
  # PostgreSQL Database (Production)
  postgres:
    image: postgres:15-alpine
    container_name: basa-postgres-prod
    env_file:
      - .env.production
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-basa_prod}
      POSTGRES_USER: ${POSTGRES_USER:-basa_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      # Localhost only: the app reaches Postgres over the Docker network, and
      # migrations/backups run via docker exec. Nothing needs this published.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - basa-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-basa_user} -d ${POSTGRES_DB:-basa_prod}"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # BASA Application (Production)
  basa-app:
    build:
      context: .
      dockerfile: Dockerfile
    # Explicit tag rather than the project-derived `basa-app-basa-app`, so the
    # deploy script can retag a known-good image back into place to roll back.
    image: basa-app:current
    container_name: basa-app-prod
    ports:
      # Localhost only: nginx reverse-proxies to this. Publishing on 0.0.0.0 put the
      # app straight on the internet, bypassing nginx's TLS, logging and rate limits.
      - "127.0.0.1:3000:3000"
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-basa_user}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-basa_prod}
    networks:
      - basa-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Prisma Studio (Production - Admin Only)
  prisma-studio:
    # Opt-in only. A database browser has no business running continuously in
    # production; start it deliberately when needed:
    #   docker compose --env-file .env.production -f docker-compose.prod.yml \
    #     --profile tools up -d prisma-studio
    profiles: ["tools"]
    image: node:22-alpine
    container_name: basa-prisma-studio-prod
    working_dir: /app
    command: ["sh", "-c", "npm install -g pnpm@9.12.2 && npm pkg delete scripts.postinstall && NODE_ENV=development pnpm install --frozen-lockfile && pnpm exec prisma generate && pnpm exec prisma studio --port 5555 --hostname 0.0.0.0"]
    env_file:
      - .env.production
    volumes:
      - ./prisma:/app/prisma:delegated
      - ./package.json:/app/package.json:delegated
      - ./pnpm-lock.yaml:/app/pnpm-lock.yaml:delegated
    ports:
      # Prisma Studio is an unauthenticated database browser. It was published on
      # 0.0.0.0 and was reachable from the internet on the live host. Localhost only,
      # reached over an SSH tunnel when actually needed:
      #   ssh -L 5555:127.0.0.1:5555 root@<host>
      - "127.0.0.1:5555:5555"
    networks:
      - basa-network
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  basa-network:
    driver: bridge 