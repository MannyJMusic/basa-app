# Rate limits for basa-app and the WordPress site (2026-09-22 audit, stage 4).
# Installed as /etc/nginx/sites-enabled/00-basa-rate-limits.conf: that directory
# is included inside `http {}`, so zones and maps can live here without editing
# nginx.conf, which CloudPanel's nightly clp-update may rewrite. The 00- prefix
# loads it before the vhosts that use it.
#
# Only POSTs to sensitive paths are counted. A map yields an empty key for
# everything else, and nginx never limits an empty key, so page loads, assets
# and NextAuth's frequent GET /api/auth/session are untouched. $uri is the
# decoded, normalised path, so percent-encoding does not dodge a match.
# The client address is the real peer: set_real_ip_from covers only private
# ranges, so X-Real-IP from the internet is ignored.

limit_req_status 429;
limit_req_log_level warn;

# Sign-in, password reset, verification, password change.
map "$request_method:$uri" $basa_auth_key {
  ~^POST:/api/auth/ $binary_remote_addr;
  default "";
}
limit_req_zone $basa_auth_key zone=basa_auth:10m rate=10r/m;

# Public forms that send mail or write rows: contact, newsletter subscribe.
map "$request_method:$uri" $basa_forms_key {
  ~^POST:/api/(contact|newsletter)(/|$) $binary_remote_addr;
  default "";
}
limit_req_zone $basa_forms_key zone=basa_forms:10m rate=5r/m;

# Checkout: each call creates a Stripe PaymentIntent and may hold seats. The
# app has its own per-IP and per-email caps; this is the outer layer.
map "$request_method:$uri" $basa_payments_key {
  ~^POST:/api/payments/ $binary_remote_addr;
  default "";
}
limit_req_zone $basa_payments_key zone=basa_payments:10m rate=10r/m;

# Image optimizer: CPU-heavy. Every request counts, at a rate a real page with
# many images stays well inside.
limit_req_zone $binary_remote_addr zone=basa_image:10m rate=20r/s;

# WordPress sign-in (brute force). Counted on the public 443 server, where the
# peer address is the client; the :8080 backend only ever sees 127.0.0.1.
map "$request_method:$uri" $basa_wplogin_key {
  ~^POST:/wp-login\.php$ $binary_remote_addr;
  default "";
}
limit_req_zone $basa_wplogin_key zone=basa_wplogin:10m rate=6r/m;
