# The app upstream (#94). Installed as /etc/nginx/sites-enabled/00-basa-upstream.conf
# (http context), so every vhost location proxies to `basa_app` rather than a port.
#
# .github/scripts/deploy-remote.sh rewrites this file during a deploy: it points it
# at a standby container on 3001 while the main container on 3000 is recreated, then
# back at 3000, with a graceful `nginx -s reload` each time, so a deploy drops no
# requests. At rest it is always 3000; this repo copy is the at-rest state.
upstream basa_app {
  server 127.0.0.1:3000;
}
