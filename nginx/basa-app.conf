# basa-app (Next.js) reverse proxy.
# The app binds 127.0.0.1:3000 only; nginx is the sole public entrance.
server {
  listen 80;
  listen [::]:80;
  server_name app.businessassociationsa.com;

  # Must stay reachable over plain HTTP for certificate renewal.
  location /.well-known/acme-challenge/ {
    root /var/www/acme;
    allow all;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name app.businessassociationsa.com;

  ssl_certificate     /etc/letsencrypt/live/basa-app/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/basa-app/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Stripe webhooks and file uploads both need headroom.
  client_max_body_size 25m;

  location /.well-known/acme-challenge/ {
    root /var/www/acme;
    allow all;
  }

  # Imported media (#111). Bind-mounted into the container at /app/public/uploads,
  # but Next.js lists public/ once at startup and 404s anything added afterwards.
  # Serving the directory straight from nginx removes that dependency and keeps
  # the images off the Node process entirely.
  location /uploads/ {
    alias /opt/basa-app/uploads/;
    try_files $uri =404;
    expires 30d;
  }

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300;
    proxy_buffering off;
  }
}
