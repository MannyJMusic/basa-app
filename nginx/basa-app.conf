# The site's nginx configuration since the WordPress cutover (#71, 2026-09-25 UTC).
# Two files on the host, concatenated here; keep this identical to them:
#   /etc/nginx/sites-enabled/businessassociationsa.com.conf      (first part: the site)
#   /etc/nginx/sites-enabled/app.businessassociationsa.com.conf  (second part: app. redirect)
# Rate-limit zones: nginx/00-basa-rate-limits.conf. Redirect rules for old WordPress
# URLs: /etc/nginx/basa-redirects.conf, generated by `pnpm migrate:urls --nginx`.

# ============================================================================
# /etc/nginx/sites-enabled/businessassociationsa.com.conf
# ============================================================================
# businessassociationsa.com after the WordPress cutover (#71).
#
# The apex IS the site: this vhost proxies to basa-app on 127.0.0.1:3000, exactly
# as app.businessassociationsa.com did before. www and the retired member. name
# redirect here. Old WordPress URLs are handled by the rules included below
# (docs/REDIRECTS.md, generated with `pnpm migrate:urls --nginx ... --same-host`):
# a mapped URL 301s to its basa-app equivalent on this same host, a retired URL
# answers 410, and anything else falls through to the app, which 404s honestly.
#
# Certificate: the `basa` certificate CloudPanel issued for the WordPress site
# covers apex, www, member. and srv1152916.hstgr.cloud (valid to 2026-12-07).
# certbot renews it with webroot challenges written into the WordPress htdocs, so
# both server blocks here serve /.well-known/acme-challenge/ from that directory
# and renewal keeps working with no change to /etc/letsencrypt.

# www and member. -> apex. One hop straight to https on the apex.
server {
  listen 80;
  listen [::]:80;
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name www.businessassociationsa.com member.businessassociationsa.com;

  ssl_certificate     /etc/letsencrypt/live/basa/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/basa/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  location /.well-known/acme-challenge/ {
    root /home/user/htdocs/srv1152916.hstgr.cloud;
    allow all;
  }

  location / {
    return 301 https://businessassociationsa.com$request_uri;
  }
}

# apex, plain HTTP -> HTTPS
server {
  listen 80;
  listen [::]:80;
  server_name businessassociationsa.com;

  location /.well-known/acme-challenge/ {
    root /home/user/htdocs/srv1152916.hstgr.cloud;
    allow all;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# apex, HTTPS: basa-app.
# Everything below the certificate lines is the hardened app vhost as it runs on
# app.businessassociationsa.com (nginx/basa-app.conf, 2026-09-24): security headers,
# the enforced CSP, the Next-Action block, the /uploads/ type allowlist, the
# /_next/image source guard and the rate limits. Keep the two in step until the
# app. vhost is retired.
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name businessassociationsa.com;

  # Its own log, so the 60-day watch for missed URLs (#71) is one grep away.
  access_log /var/log/nginx/basa-apex.access.log main;
  error_log  /var/log/nginx/basa-apex.error.log;

  ssl_certificate     /etc/letsencrypt/live/basa/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/basa/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  # Security headers. A location with its own add_header drops ALL of these (nginx
  # inherits add_header only when a level defines none), so any such location must
  # repeat them; /uploads/ below does.
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  # Nothing uses the camera, microphone or location. payment is kept for Stripe's
  # iframe (Apple Pay / Google Pay buttons).
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), usb=(), serial=(), hid=(), bluetooth=(), midi=(), browsing-topics=(), payment=(self \"https://js.stripe.com\")" always;

  # Content Security Policy (2026-09-22 audit, M-A5). Enforced since 2026-09-24,
  # after a report-only period with no violations beyond the one below.
  # Violations are still reported to Sentry (basa-v3, "security" events; the key
  # is the public DSN key already in the browser bundle). A new third-party
  # script, frame, font or API origin must be added here BEFORE the code that
  # uses it ships, or the browser blocks it.
  # - script-src needs 'unsafe-inline': Next's App Router emits inline bootstrap
  #   scripts, and nonces would need middleware plus fully dynamic rendering.
  #   No 'unsafe-eval': the only eval on the site is is-generator-function's
  #   feature test (browser util polyfill), which falls back when blocked.
  # - Stripe origins are from Stripe's published CSP guidance.
  # - img-src allows any https: member logos and avatars can live anywhere.
  # - form-action includes Google: NextAuth's sign-in form POSTs to /api/auth and
  #   is redirected to Google, and browsers check form-action on that redirect.
  # - worker-src blob: is Sentry Replay's compression worker.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://js.stripe.com https://*.js.stripe.com https://maps.googleapis.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://api.stripe.com https://maps.googleapis.com; frame-src 'self' https://js.stripe.com https://*.js.stripe.com https://hooks.stripe.com https://www.youtube.com https://www.youtube-nocookie.com; worker-src 'self' blob:; media-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self' https://accounts.google.com https://checkout.stripe.com; frame-ancestors 'self'; upgrade-insecure-requests; report-uri https://o4509585254711296.ingest.us.sentry.io/api/4512127203344384/security/?sentry_key=f37de2d00e7d14cf86de3bc6ac1f948d" always;

  # Stripe webhooks and file uploads both need headroom.
  client_max_body_size 25m;

  # 2026-09-21 incident: CVE-2025-55182 (React Server Components RCE) is reached only
  # through server-action POSTs, which Next.js recognises by this header. basa-app
  # has no server actions, so any request carrying it is hostile. Remove once the
  # app runs Next >= 15.3.6 and has been re-verified.
  if ($http_next_action) { return 403; }

  location /.well-known/acme-challenge/ {
    root /home/user/htdocs/srv1152916.hstgr.cloud;
    allow all;
  }

  # Old WordPress URLs. Destinations are host-relative because this host is the
  # app; the generator was run with --same-host so nothing redirects to itself.
  # Exact-match locations, so they take precedence over the prefix ones below.
  set $basa_target "";
  include /etc/nginx/basa-redirects.conf;

  # Imported media (#111). Bind-mounted into the container at /app/public/uploads,
  # but Next.js lists public/ once at startup and 404s anything added afterwards.
  # Serving the directory straight from nginx removes that dependency and keeps
  # the images off the Node process entirely.
  #
  # Only image and PDF types are served as themselves (2026-09-22 audit, M-B4).
  # Anything else - html, svg, js - goes out as application/octet-stream, which
  # with nosniff the browser downloads instead of rendering on this origin.
  location /uploads/ {
    alias /opt/basa-app/uploads/;
    types {
      image/jpeg      jpg jpeg;
      image/png       png;
      image/gif       gif;
      image/webp      webp;
      image/avif      avif;
      application/pdf pdf;
    }
    default_type application/octet-stream;
    try_files $uri =404;
    expires 30d;
    # Defining add_header here stops the server-level headers being inherited.
    # That is deliberate: it keeps both CSP headers off these files (a CSP on a PDF
    # response can stop Chrome's viewer). The others are repeated.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  # 2026-09-22 audit: the Next.js image optimizer (/_next/image) fetches whatever
  # url= names and hands it to sharp/libheif; Next < 15.5.24 is exploitable via
  # crafted AVIF (GHSA-2xp9-vwfh-vxw4). Until the app is on 15.5.25 with a
  # restricted images.remotePatterns, only allow relative paths and our own hosts.
  location = /_next/image {
    # $arg_url is still percent-encoded here, so match both raw and encoded forms.
    if ($arg_url ~* "^https?(://|%3a%2f%2f)(?!((app|www)\.)?businessassociationsa\.com(/|%2f|$)|lh3\.googleusercontent\.com(/|%2f|$))") { return 403; }
    limit_req zone=basa_image burst=200 nodelay;
    proxy_pass http://basa_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60;
  }

  location / {
    # Zones and keys are in 00-basa-rate-limits.conf; each only counts POSTs to
    # its own paths, so these are no-ops for everything else.
    limit_req zone=basa_auth burst=20 nodelay;
    limit_req zone=basa_forms burst=5 nodelay;
    limit_req zone=basa_payments burst=10 nodelay;
    proxy_pass http://basa_app;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300;
    proxy_buffering off;
  }
}

# ============================================================================
# /etc/nginx/sites-enabled/app.businessassociationsa.com.conf
# ============================================================================
# app.businessassociationsa.com after the cutover (#71): the app moved to the apex,
# so this name only redirects. Replaces the proxying vhost in nginx/basa-app.conf.
#
# One exception: Stripe posts webhooks to the URL registered on the endpoint and
# does not follow redirects. cutover.sh moves that URL to the apex, but events
# already in flight, and any retry of an earlier failure, still arrive here, so
# /api/webhooks/ keeps proxying to the app. Everything else is a 301.
#
# Certificate renewal for this name uses /var/www/acme (see
# /etc/letsencrypt/renewal/basa-app.conf); that location stays.
server {
  listen 80;
  listen [::]:80;
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name app.businessassociationsa.com;

  ssl_certificate     /etc/letsencrypt/live/basa-app/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/basa-app/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  location /.well-known/acme-challenge/ {
    root /var/www/acme;
    allow all;
  }

  location /api/webhooks/ {
    proxy_pass http://basa_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300;
    proxy_buffering off;
  }

  location / {
    return 301 https://businessassociationsa.com$request_uri;
  }
}
