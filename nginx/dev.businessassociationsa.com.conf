# Install after certbot has issued /etc/letsencrypt/live/basa-sandbox/.
# Basic auth applies to the entire review site; only ACME challenges bypass it.
server {
  listen 80;
  listen [::]:80;
  server_name dev.businessassociationsa.com;

  location /.well-known/acme-challenge/ {
    root /var/www/acme;
    auth_basic off;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name dev.businessassociationsa.com;

  ssl_certificate /etc/letsencrypt/live/basa-sandbox/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/basa-sandbox/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  access_log /var/log/nginx/basa-sandbox.access.log main;
  error_log /var/log/nginx/basa-sandbox.error.log;

  auth_basic "BASA review sandbox";
  auth_basic_user_file /etc/nginx/basa-sandbox.htpasswd;
  add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  client_max_body_size 25m;

  location /.well-known/acme-challenge/ {
    root /var/www/acme;
    auth_basic off;
  }

  location /uploads/ {
    alias /opt/basa-sandbox/uploads/;
    types {
      image/jpeg jpg jpeg;
      image/png png;
      image/gif gif;
      image/webp webp;
      image/avif avif;
      application/pdf pdf;
    }
    default_type application/octet-stream;
    try_files $uri =404;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  location / {
    proxy_pass http://127.0.0.1:3002;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 300;
    proxy_buffering off;
  }
}
