# businessassociationsa.com after the WordPress cutover (#71, Friday 2026-09-18 COB).
#
# The apex, www and the retired member. hostname all land here and are sent to
# basa-app at app.businessassociationsa.com:
#   - a URL in the redirect map (docs/REDIRECTS.md) goes to its basa-app equivalent
#   - a retired URL (syndicated news, plugin internals) answers 410 Gone
#   - anything else keeps its path, so /events, /membership etc. just work
# The per-URL rules are exact-match locations in /etc/nginx/basa-redirects.conf,
# generated by `pnpm migrate:urls --nginx` and included below.
#
# One server block for both ports: applying the maps on plain HTTP too means a
# single hop to the final URL instead of http -> https -> destination.
#
# The certificate is the one CloudPanel issued for the WordPress site; it covers
# all three names here plus srv1152916.hstgr.cloud and is valid to 2026-12-07.
# Its certbot renewal writes challenges into the WordPress htdocs, so this vhost
# serves /.well-known/acme-challenge/ from that same directory and renewal keeps
# working with no change to /etc/letsencrypt.
server {
  listen 80;
  listen [::]:80;
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name businessassociationsa.com www.businessassociationsa.com member.businessassociationsa.com;

  ssl_certificate     /etc/letsencrypt/live/basa/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/basa/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options "nosniff" always;

  # Its own log, so the 60-day watch for missed URLs (#71) is one grep away.
  access_log /var/log/nginx/basa-apex.access.log main;
  error_log  /var/log/nginx/basa-apex.error.log;

  # Certificate renewal must keep working on plain HTTP. Same webroot certbot
  # already uses for the `basa` certificate (see /etc/letsencrypt/renewal/basa.conf).
  location /.well-known/acme-challenge/ {
    root /home/user/htdocs/srv1152916.hstgr.cloud;
    allow all;
  }

  # Where the old URLs go. Set to "" once basa-app itself serves the apex, and every
  # rule below becomes host-relative with no other change.
  set $basa_target https://app.businessassociationsa.com;
  include /etc/nginx/basa-redirects.conf;

  location / {
    return 301 https://app.businessassociationsa.com$request_uri;
  }
}
