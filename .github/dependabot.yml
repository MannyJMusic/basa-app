# 2026-09-22 audit (H-B4): the Next RCE fix only arrived after exploitation,
# because nothing told anyone a patched version existed.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    target-branch: dev
    groups:
      # Next and its ESLint config move together.
      next:
        patterns: ["next", "eslint-config-next", "@next/*"]
      sentry:
        patterns: ["@sentry/*"]
      prisma:
        patterns: ["prisma", "@prisma/*"]
      # Everything else arrives as one PR instead of one per package.
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # Majors are deliberate upgrades, not background PRs; security updates for
    # them still arrive through Dependabot security updates.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: dev
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Majors are skipped here too: for the node base image a "major" is a Node
  # release line, and production stays on an LTS line (22) until moved on purpose.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    target-branch: dev
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
