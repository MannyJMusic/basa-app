name: Deploy to Production

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

# Actions are pinned by commit SHA (tags can be moved) and the token is
# read-only; Dependabot proposes updates (.github/dependabot.yml). 2026-09-22 audit.
permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install pnpm
        # No `version`: it reads package.json's packageManager (pnpm 9.12.2), the
        # same pin the Dockerfile uses.
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Critical only for now: the remaining highs (30 on 2026-09-22) are all in
      # the build toolchain under next/sentry, with no fixed version yet. Raise
      # to --audit-level=high once they clear.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=critical

      - name: Run type check
        run: pnpm run type-check

      - name: Run linter
        run: pnpm run lint

      # Tests did not run in CI at all, which made every test in the repo advisory:
      # nothing stopped a PR that broke them. The GitHub runner has Docker, so the
      # Testcontainers suite can run here even though it cannot on every laptop.
      - name: Run unit tests
        run: pnpm run test:unit

      - name: Run integration tests
        run: pnpm run test:integration

      - name: Build application
        run: pnpm exec next build
        env:
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY || 'pk_test_placeholder' }}
          NEXT_PUBLIC_APP_URL: https://app.businessassociationsa.com
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

  # The production image, built exactly as the host builds it. Without this a
  # Dockerfile or .dockerignore change was first tested by the production deploy,
  # which is how release #168 failed (e2e/ dockerignored). No .env.production
  # here, so NEXT_PUBLIC_* are empty and no source maps upload; the point is
  # that the image builds, not what it is configured with.
  docker-build:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build production image
        run: DOCKER_BUILDKIT=1 docker build --target production -t basa-app:ci .

  # The money path in a real browser against a real build (#65): a guest buys a
  # ticket, a visitor joins as a member, a declined card confirms nothing. Runs on
  # every PR and every push to main, and the deploy waits for it: a broken checkout
  # must not reach production.
  e2e:
    name: End-to-end (money path)
    runs-on: ubuntu-latest
    needs: build-and-test
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: basa
          POSTGRES_PASSWORD: basa
          POSTGRES_DB: basa_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U basa -d basa_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      E2E_DATABASE_URL: postgresql://basa:basa@localhost:5432/basa_e2e
      DATABASE_URL: postgresql://basa:basa@localhost:5432/basa_e2e
      NEXTAUTH_URL: http://localhost:3100
      NEXT_PUBLIC_APP_URL: http://localhost:3100
      NEXTAUTH_SECRET: e2e-only-not-a-real-secret-0123456789abcdef
      MEMBERSHIP_SALES_ENABLED: 'true'
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_TEST_PUBLISHABLE_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_TEST_WEBHOOK_SECRET }}
      # No mail leaves CI.
      MAILGUN_API_KEY: ''
      SMTP_HOST: ''

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install pnpm
        # No `version`: it reads package.json's packageManager (pnpm 9.12.2), the
        # same pin the Dockerfile uses.
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      # A production build, so the specs exercise what ships. NEXT_PUBLIC_* values
      # are baked in here, which is why the Stripe test publishable key is set above.
      - name: Build application
        run: pnpm exec next build

      - name: Run end-to-end tests
        run: pnpm exec playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  deploy:
    name: Deploy to Production
    needs: [build-and-test, docker-build, e2e]
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    environment: production
    # Two quick pushes to main must not run two deploys at once: both would
    # `git reset --hard` and build on the host, and the second would take the
    # first's half-built image as its rollback point. Queue instead of cancel,
    # so a deploy that has started always finishes (or rolls back).
    concurrency:
      group: production-deploy
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Secrets are read through env rather than interpolated straight into the
      # command line, and whitespace-trimmed before use. A SERVER_HOST saved with
      # a trailing newline - which is what pasting into the GitHub UI usually
      # produces - broke every deploy from 2026-09-06 with the unhelpful
      # "hostname contains invalid characters", because ssh received
      # "root@31.97.214.26\n". The old emptiness check could not catch it: a
      # newline is not empty. See #75.
      - name: Validate deploy secrets
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          set -euo pipefail

          fail=0
          if [ -z "${SSH_PRIVATE_KEY:-}" ]; then
            echo "::error::SSH_PRIVATE_KEY is not set."
            fail=1
          fi

          # xargs with no args collapses surrounding whitespace, including newlines.
          host="$(printf '%s' "${SERVER_HOST:-}" | xargs || true)"
          user="$(printf '%s' "${SERVER_USER:-}" | xargs || true)"

          if [ -z "$host" ]; then
            echo "::error::SERVER_HOST is not set (or is only whitespace)."
            fail=1
          elif ! printf '%s' "$host" | grep -Eq '^[A-Za-z0-9._-]+$'; then
            echo "::error::SERVER_HOST is not a plain hostname or IP after trimming."
            echo "::error::Re-enter it in repository settings with no trailing newline."
            fail=1
          fi

          if [ -z "$user" ]; then
            echo "::error::SERVER_USER is not set (or is only whitespace)."
            fail=1
          elif ! printf '%s' "$user" | grep -Eq '^[A-Za-z0-9._-]+$'; then
            echo "::error::SERVER_USER is not a plain username after trimming."
            fail=1
          fi

          [ "$fail" -eq 0 ] || exit 1

          if [ "$host" != "${SERVER_HOST:-}" ] || [ "$user" != "${SERVER_USER:-}" ]; then
            echo "::warning::A deploy secret had surrounding whitespace and was trimmed."
            echo "::warning::Re-save SERVER_HOST / SERVER_USER without it to silence this."
          fi

          # Publish the trimmed values for the later steps. Marked as secrets so
          # they stay masked in logs even though they came back through env.
          echo "::add-mask::$host"
          echo "SSH_HOST=$host" >> "$GITHUB_ENV"
          echo "SSH_USER=$user" >> "$GITHUB_ENV"
          echo "Deploy secrets validated."

      # The host key comes from the SSH_KNOWN_HOSTS secret (taken from the server's
      # own /etc/ssh keys), not from ssh-keyscan at run time: a keyscan trusts
      # whoever answers, which is exactly what host-key checking exists to stop.
      - name: Setup SSH Key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [ -z "${SSH_KNOWN_HOSTS:-}" ]; then
            echo "::error::SSH_KNOWN_HOSTS is not set; refusing to deploy without a verified host key."
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

          # Keepalives matter more than they look. The image build on this 2-CPU VPS
          # runs for minutes, and the deploy is a single ssh session held open for the
          # whole thing. On 2026-09-09 that session was dropped mid-build with
          # "client_loop: send disconnect: Broken pipe": the deploy step failed while
          # the build carried on server-side, orphaned, with none of the steps after it
          # - up, health check, rollback - ever running.
          echo "SSH_OPTS=-i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o TCPKeepAlive=yes" >> "$GITHUB_ENV"

      - name: Test SSH Connection
        run: |
          ssh $SSH_OPTS "$SSH_USER@$SSH_HOST" echo "SSH connection successful"

      - name: Deploy to Server
        run: |
          ssh $SSH_OPTS "$SSH_USER@$SSH_HOST" 'bash -s' < .github/scripts/deploy-remote.sh

      - name: Verify Deployment
        run: |
          echo "Verifying deployment..."
          sleep 10
          ssh $SSH_OPTS "$SSH_USER@$SSH_HOST" 'bash -s' < .github/scripts/verify-remote.sh

      - name: Notify on Failure
        if: failure()
        run: |
          echo "Deployment failed! Check the logs above for details."
